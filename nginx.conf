server {
    listen 8081;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Lightweight endpoint for container and load balancer health checks
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
